name: tests

on:
  push:
    branches: [main, native/integration]
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", "docs/ops.schema.json", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, native/integration]
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", "docs/ops.schema.json", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --extra dev --extra mcp --extra app
      - run: uv run pytest -q
