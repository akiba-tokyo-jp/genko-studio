name: native

# The C++ build (docs/cpp-migration). Runs beside the Python tests (ci.yml), which stay the baseline until M7.
on:
  push:
    paths: ["native/**", "docs/cpp-migration/**", "tools/migration/**", "tools/ci/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "docs/cpp-migration/**", "tools/migration/**", "tools/ci/**", ".github/workflows/native.yml"]

permissions:
  contents: read

env:
  QT_VERSION: "6.11.2"
  AQT_VERSION: "3.3.0"

jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/migration/build_ledger.py --check

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-release, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build g++ cmake pkg-config ccache \
            libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev liblcms2-dev libpng-dev libjpeg-turbo8-dev libtiff-dev libwebp-dev zlib1g-dev \
            nlohmann-json3-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-shape0 xvfb fonts-ipafont-gothic fonts-ipafont-mincho
      - name: Qt (official binaries, LGPL modules only)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-imageformats
      - if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pipx run "aqtinstall==${AQT_VERSION}" install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -m qtimageformats -O "${{ runner.temp }}/qt"
      - name: Python reference (contract tests only)
        run: |
          python3 -m venv /tmp/pyref
          /tmp/pyref/bin/pip install -q 'pillow==12.3.0' 'numpy==2.4.6' 'psd-tools==1.10.9'
          echo "GENKO_PYREF=/tmp/pyref/bin/python" >> "$GITHUB_ENV"
      - name: Configure, build, test
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/qt/${{ env.QT_VERSION }}/gcc_64
          QT_QPA_PLATFORM: offscreen
        run: |
          cd native
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }} --label-exclude perf

  windows:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Qt (official binaries, LGPL modules only)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}\qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-imageformats-v2
      - if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python tools/ci/fetch_qt.py --os windows --out "$env:RUNNER_TEMP\qt"
      - name: Configure, build, test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:CMAKE_PREFIX_PATH = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2022_64"
          $env:PATH = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          cd native
          cmake --preset windows-release
          cmake --build --preset windows-release
          ctest --preset windows-release --label-exclude "perf|contract"
