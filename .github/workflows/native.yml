name: native

# The C++ build (docs/cpp-migration). Runs beside the Python tests (ci.yml), which stay the baseline until M7.
on:
  push:
    paths: ["native/**", "docs/cpp-migration/**", "tools/migration/**", "tools/ci/**", "tools/acceptance/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "docs/cpp-migration/**", "tools/migration/**", "tools/ci/**", "tools/acceptance/**", ".github/workflows/native.yml"]

permissions:
  contents: read

env:
  QT_VERSION: "6.11.2"
  AQT_VERSION: "3.3.0"

jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/migration/build_ledger.py --check

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-release, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build g++ cmake pkg-config ccache \
            libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev liblcms2-dev libpng-dev libjpeg-turbo8-dev libtiff-dev libwebp-dev zlib1g-dev \
            nlohmann-json3-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-shape0 xvfb fonts-ipafont-gothic fonts-ipafont-mincho
      - name: Qt (official binaries, LGPL modules only)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-imageformats
      - if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pipx run "aqtinstall==${AQT_VERSION}" install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -m qtimageformats -O "${{ runner.temp }}/qt"
      - name: Python reference (contract tests only)
        run: |
          python3 -m venv /tmp/pyref
          /tmp/pyref/bin/pip install -q 'pillow==12.3.0' 'numpy==2.4.6' 'psd-tools==1.10.9'
          echo "GENKO_PYREF=/tmp/pyref/bin/python" >> "$GITHUB_ENV"
      - name: Configure, build, test
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/qt/${{ env.QT_VERSION }}/gcc_64
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cd native
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }} --label-exclude perf --no-tests=error

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-release, windows-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Paths
        shell: pwsh
        run: |
          "GENKO_VCPKG=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-bin" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-bin,readwrite" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Qt (official binaries, LGPL modules only)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}\qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-imageformats-v2
      - if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python tools/ci/fetch_qt.py --os windows --out "$env:RUNNER_TEMP\qt"
      - name: vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $baseline = (Get-Content native/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          # (msvc-dev-cmd sets VCPKG_ROOT to the copy bundled with Visual Studio; ours is GENKO_VCPKG)
          git clone --quiet https://github.com/microsoft/vcpkg "$env:GENKO_VCPKG"
          git -C "$env:GENKO_VCPKG" checkout --quiet $baseline
          & "$env:GENKO_VCPKG\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: vcpkg binary cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bin
          key: vcpkg-bin-${{ hashFiles('native/vcpkg.json') }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ hashFiles('native/vcpkg.json') }}-${{ matrix.preset }}-
            vcpkg-bin-${{ hashFiles('native/vcpkg.json') }}-
      - name: Configure, build, test
        id: build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Join-Path $env:VSINSTALLDIR 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (Test-Path (Join-Path $vsNinja 'ninja.exe')) { $env:PATH = "$vsNinja;$env:PATH" } else { choco install ninja --no-progress -y }
          }
          ninja --version
          $env:VCPKG_ROOT = $env:GENKO_VCPKG
          $env:CMAKE_PREFIX_PATH = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2022_64"
          $env:PATH = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          cd native
          cmake --preset ${{ matrix.preset }}
          # (-k 0: report every file that fails to compile, not only the first)
          cmake --build --preset ${{ matrix.preset }} -- -k 0
          # (every test's own output goes to ctest-output.log: QtTest prints which check failed)
          ctest --preset ${{ matrix.preset }} --label-exclude "perf|contract" --no-tests=error -V --output-log "$env:RUNNER_TEMP\ctest-output.log"
      - name: Failed tests, run one by one
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          Set-Location "build\${{ matrix.preset }}"
          foreach ($exe in Get-ChildItem -Filter 'test_*.exe') {
            $name = $exe.BaseName
            $log = "$env:RUNNER_TEMP\qtest-$name.txt"
            Push-Location tests
            & $exe.FullName -o "$log,txt" *> "$env:RUNNER_TEMP\stdout-$name.txt"
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) {
              Write-Output ("=== {0}: exit 0x{1:X8}" -f $name, $code)
              if (Test-Path $log) { Get-Content $log | Select-String -Pattern 'FAIL!|Loc:|Actual|Expected|QWARN|QFATAL|QCRITICAL|Totals' | Select-Object -First 40 | ForEach-Object { $_.Line } }
              else { Write-Output '(no QtTest log)'; Get-Content "$env:RUNNER_TEMP\stdout-$name.txt" -ErrorAction SilentlyContinue | Select-Object -First 20 }
            }
          }
      - name: Test output (also after a failed test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/ctest-output.log
            ${{ runner.temp }}/qtest-*.txt
            ${{ runner.temp }}/stdout-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: vcpkg binary cache (save, also after a failed build)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-bin
          key: vcpkg-bin-${{ hashFiles('native/vcpkg.json') }}-${{ matrix.preset }}-${{ github.run_id }}
