[project]
name = "genko-studio"
version = "0.1.0"
description = "Manga manuscript OS for Windows and Linux — page management, name, frames, story editor, export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Genko Studio" }]
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
app = ["pyside6>=6.6"]
dev = ["pytest>=8.0", "psd-tools>=1.9"]  # psd-tools only reads back exported PSDs in tests
mcp = ["mcp>=2,<3"]

[project.scripts]
genko = "genko.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
